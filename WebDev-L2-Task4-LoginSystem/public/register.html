<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>Create an account</h1>
    <p class="lede">It takes a few seconds.</p>
    <form id="auth-form" data-mode="register" novalidate>
      <p id="message" class="message" role="alert"></p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" required>
      <p class="hint">At least 8 characters, including one number.</p>
      <button type="submit">Register</button>
    </form>
    <p class="switch">Already registered? <a href="/login.html">Log in</a></p>
  </main>
  <script src="/auth.js"></script>
</body>
</html>
